# 复制为 devices.local.yaml 放到 exe 同目录的 config\ 下（或 exe 同目录），
# 勿提交含密码的文件。现场按实际 IP 修改。
pc:
  local_ip: "192.168.11.105"   # 本机在机器人网段的 IP（臂 reverse 回连）

arm:
  kind: elite_cs               # mock | elite_cs
  host: "192.168.11.150"

camera:
  kind: hikvision
  host: "192.168.11.103"
  user: "admin"
  # password: ""              # 或设环境变量 ROBOT_CAMERA_PASSWORD

ranging:
  enabled: true
  kind: elite_cabinet_rs485
  baud: 115200                # 本机 HF 实测；手册默认 9600
  parity: 0
  slave: 1
  # ssh_password: ""          # 柜体 SSH。填写后走官方 startBoardRs485，与机械臂并行测距
  # 也可设环境变量 ROBOT_CABINET_SSH_PASSWORD
